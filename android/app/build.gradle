import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def pakietAplikacji = new JsonSlurper().parse(rootProject.file('../package.json'))
def wersjaAplikacji = pakietAplikacji.version as String
def skladoweWersji = wersjaAplikacji =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!skladoweWersji.matches()) {
    throw new GradleException('Wersja w package.json musi mieć format X.Y.Z.')
}
def kodWersjiAplikacji = skladoweWersji[0][1].toInteger() * 1_000_000 + skladoweWersji[0][2].toInteger() * 1_000 + skladoweWersji[0][3].toInteger()
def plikWlasciwosciPodpisu = rootProject.file('keystore.properties')
def wlasciwosciPodpisu = new Properties()
if (plikWlasciwosciPodpisu.exists()) {
    plikWlasciwosciPodpisu.withInputStream { wlasciwosciPodpisu.load(it) }
}
def wymaganePolaPodpisu = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def brakujacePolaPodpisu = wymaganePolaPodpisu.findAll { pole ->
    !wlasciwosciPodpisu.getProperty(pole)?.trim() || wlasciwosciPodpisu.getProperty(pole).contains('UZUPELNIJ')
}
def czyKonfiguracjaPodpisuPelna = plikWlasciwosciPodpisu.exists() && brakujacePolaPodpisu.isEmpty()
def plikWlasciwosciLokalnych = rootProject.file('local.properties')
def wlasciwosciLokalne = new Properties()
if (plikWlasciwosciLokalnych.exists()) {
    plikWlasciwosciLokalnych.withInputStream { wlasciwosciLokalne.load(it) }
}
def kluczPicovoice = System.getenv('PICOVOICE_ACCESS_KEY') ?: wlasciwosciLokalne.getProperty('picovoice.accessKey', '')
def literalKluczaPicovoice = '"' + kluczPicovoice.replace('\\', '\\\\').replace('"', '\\"') + '"'
def odczytajZmiennaRuntime = { nazwa ->
    def zeSrodowiska = System.getenv(nazwa)?.trim()
    if (zeSrodowiska) return zeSrodowiska
    def wartosc = ''
    ['.env', '.env.local', '.env.production', '.env.production.local'].each { nazwaPliku ->
        def plik = rootProject.file("../${nazwaPliku}")
        if (!plik.exists()) return
        plik.eachLine { linia ->
            def dopasowanie = (linia =~ /^\s*${java.util.regex.Pattern.quote(nazwa)}\s*=\s*(.*)$/)
            if (dopasowanie.matches()) {
                wartosc = dopasowanie[0][1].trim().replaceAll(/^(['"])(.*)\1$/, '\\$2').trim()
            }
        }
    }
    return wartosc
}
def literalKonfiguracjiRuntime = { nazwa ->
    '"' + odczytajZmiennaRuntime(nazwa).replace('\\', '\\\\').replace('"', '\\"') + '"'
}
def numerBety = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
def poprawnyNumerBety = numerBety ==~ /[1-9][0-9]*/ && numerBety.toBigInteger() <= 2_100_000_000
android {
    namespace = "pl.ogarniacz.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.ogarniacz.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode kodWersjiAplikacji
        versionName wersjaAplikacji
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "PICOVOICE_ACCESS_KEY", literalKluczaPicovoice
        buildConfigField "String", "SYNC_API_URL", literalKonfiguracjiRuntime('VITE_SYNC_API_URL')
        buildConfigField "String", "ANDROID_UPDATE_MANIFEST_URL", literalKonfiguracjiRuntime('VITE_ANDROID_UPDATE_MANIFEST_URL')
        buildConfigField "boolean", "KANAL_BETA", "false"
        manifestPlaceholders = [schematLinkow: 'ogarniacz']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    signingConfigs {
        beta {
            storeFile file(System.getenv('ANDROID_BETA_KEYSTORE_PATH') ?: 'brak-beta.jks')
            storePassword System.getenv('ANDROID_BETA_STORE_PASSWORD')
            keyAlias System.getenv('ANDROID_BETA_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_BETA_KEY_PASSWORD')
        }
        release {
            if (czyKonfiguracjaPodpisuPelna) {
                storeFile rootProject.file(wlasciwosciPodpisu.getProperty('storeFile'))
                storePassword wlasciwosciPodpisu.getProperty('storePassword')
                keyAlias wlasciwosciPodpisu.getProperty('keyAlias')
                keyPassword wlasciwosciPodpisu.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        beta {
            initWith release
            applicationIdSuffix '.beta'
            signingConfig signingConfigs.beta
            matchingFallbacks = ['release']
            buildConfigField "boolean", "KANAL_BETA", "true"
            buildConfigField "String", "SYNC_API_URL", '""'
            buildConfigField "String", "ANDROID_UPDATE_MANIFEST_URL", '""'
            buildConfigField "String", "PICOVOICE_ACCESS_KEY", '""'
            manifestPlaceholders = [schematLinkow: 'ogarniacz-beta']
        }
        release {
            if (czyKonfiguracjaPodpisuPelna) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { grafZadan ->
    if (grafZadan.allTasks.any { it.path == ':app:packageBeta' }) {
        if (!poprawnyNumerBety || (System.getenv('GITHUB_RUN_ATTEMPT') ?: '1') != '1') throw new GradleException('Nieprawidłowy numer Bety lub ponowienie workflow.')
        if (!System.getenv('ANDROID_BETA_KEYSTORE_PATH') || !android.signingConfigs.beta.storeFile.exists()) throw new GradleException('Beta wymaga osobnego trwałego keystore.')
    }
    def czyPowstajeArtefaktRelease = grafZadan.allTasks.any { zadanie ->
        zadanie.path == ':app:packageRelease' || zadanie.path == ':app:packageReleaseBundle'
    }
    if (czyPowstajeArtefaktRelease && !czyKonfiguracjaPodpisuPelna) {
        def szczegoly = plikWlasciwosciPodpisu.exists()
            ? " Brakujące pola: ${brakujacePolaPodpisu.join(', ')}."
            : ''
        throw new GradleException("Brak kompletnego android/keystore.properties z danymi istniejącego klucza release.${szczegoly}")
    }
    if (czyPowstajeArtefaktRelease && !rootProject.file(wlasciwosciPodpisu.getProperty('storeFile')).exists()) {
        throw new GradleException('Nie znaleziono pliku stałego release keystore wskazanego w android/keystore.properties.')
    }

}

android.applicationVariants.all { wariant ->
    wariant.outputs.all { wyjscie ->
        if (wariant.buildType.name == 'beta') {
            wyjscie.versionCodeOverride = poprawnyNumerBety ? numerBety.toInteger() : 1
            wyjscie.versionNameOverride = "1.1.0-beta." + numerBety
            wyjscie.outputFileName = "Ogarniacz-beta-" + numerBety + "-android.apk"
            return
        }
        wyjscie.outputFileName = "Ogarniacz-${wersjaAplikacji}-${wariant.buildType.name}.apk"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'ai.picovoice:porcupine-android:4.0.2'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
