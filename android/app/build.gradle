import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def pakietAplikacji = new JsonSlurper().parse(rootProject.file('../package.json'))
def wersjaAplikacji = pakietAplikacji.version as String
def skladoweWersji = wersjaAplikacji =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!skladoweWersji.matches()) {
    throw new GradleException('Wersja w package.json musi mieć format X.Y.Z.')
}
def kodWersjiAplikacji = skladoweWersji[0][1].toInteger() * 1_000_000 + skladoweWersji[0][2].toInteger() * 1_000 + skladoweWersji[0][3].toInteger()
def plikWlasciwosciPodpisu = rootProject.file('keystore.properties')
def wlasciwosciPodpisu = new Properties()
if (plikWlasciwosciPodpisu.exists()) {
    plikWlasciwosciPodpisu.withInputStream { wlasciwosciPodpisu.load(it) }
}
def wymaganePolaPodpisu = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def brakujacePolaPodpisu = wymaganePolaPodpisu.findAll { pole ->
    !wlasciwosciPodpisu.getProperty(pole)?.trim() || wlasciwosciPodpisu.getProperty(pole).contains('UZUPELNIJ')
}
def czyKonfiguracjaPodpisuPelna = plikWlasciwosciPodpisu.exists() && brakujacePolaPodpisu.isEmpty()

android {
    namespace = "pl.ogarniacz.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.ogarniacz.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode kodWersjiAplikacji
        versionName wersjaAplikacji
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (czyKonfiguracjaPodpisuPelna) {
                storeFile rootProject.file(wlasciwosciPodpisu.getProperty('storeFile'))
                storePassword wlasciwosciPodpisu.getProperty('storePassword')
                keyAlias wlasciwosciPodpisu.getProperty('keyAlias')
                keyPassword wlasciwosciPodpisu.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (czyKonfiguracjaPodpisuPelna) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { grafZadan ->
    def czyPowstajeArtefaktRelease = grafZadan.allTasks.any { zadanie ->
        zadanie.path == ':app:packageRelease' || zadanie.path == ':app:packageReleaseBundle'
    }
    if (czyPowstajeArtefaktRelease && !czyKonfiguracjaPodpisuPelna) {
        def szczegoly = plikWlasciwosciPodpisu.exists()
            ? " Brakujące pola: ${brakujacePolaPodpisu.join(', ')}."
            : ''
        throw new GradleException("Brak kompletnego android/keystore.properties z danymi istniejącego klucza release.${szczegoly}")
    }
    if (czyPowstajeArtefaktRelease && !rootProject.file(wlasciwosciPodpisu.getProperty('storeFile')).exists()) {
        throw new GradleException('Nie znaleziono pliku stałego release keystore wskazanego w android/keystore.properties.')
    }
}

android.applicationVariants.all { wariant ->
    wariant.outputs.all { wyjscie ->
        wyjscie.outputFileName = "Ogarniacz-${wersjaAplikacji}-${wariant.buildType.name}.apk"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
