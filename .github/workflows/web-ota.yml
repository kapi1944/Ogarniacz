name: Publikacja Web OTA

on:
  workflow_dispatch:

# Android Web OTA wycofany; historyczne kroki pozostają jako legacy.
permissions:
  actions: read
  contents: read

concurrency:
  group: web-ota-production
  cancel-in-progress: false

jobs:
  bramka_ci:
    name: Potwierdz zielone CI dla commita
    if: ${{ false }} # Blokada również ręcznego publikowania.
    runs-on: ubuntu-latest
    outputs:
      commit_ci: ${{ steps.ci.outputs.commit_ci }}
    env:
      COMMIT_CI: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Sprawdz zakonczone sukcesem CI dla tego samego SHA
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          wynik="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$COMMIT_CI&status=completed" --jq '.workflow_runs | any(.[]; .head_sha == env.COMMIT_CI and .head_branch == "main" and .event == "push" and .conclusion == "success")')"
          [[ "$wynik" == "true" ]] || { echo "Brak zielonego pelnego CI dla commita $COMMIT_CI." >&2; exit 1; }
          echo "commit_ci=$COMMIT_CI" >> "$GITHUB_OUTPUT"

  ocena:
    name: Ocen zgodnosc z APK
    needs: bramka_ci
    runs-on: ubuntu-latest
    outputs:
      publikuj: ${{ steps.klasyfikacja.outputs.publikuj }}
      commit_bundla: ${{ steps.klasyfikacja.outputs.commit_bundla }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bramka_ci.outputs.commit_ci }}
          fetch-depth: 0

      - name: Sklasyfikuj zmiany
        id: klasyfikacja
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plik_zgodnosci="config/web-ota-compatibility.json"
          if [[ ! -f "$plik_zgodnosci" ]]; then
            echo "Web OTA pominięte — najpierw wymagane jest nowe APK / zwiększenie minNativeVersionCode."
            echo "Powod: Brak kontrolowanego zrodla zgodnosci z APK."
            echo "publikuj=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          kod_zgodnego_apk="$(node scripts/web-ota-zgodnosc.mjs --odczytaj < "$plik_zgodnosci")"
          tag_zgodnego_apk="$(node scripts/web-ota-zgodnosc.mjs --tag-apk "$kod_zgodnego_apk")"
          if ! git rev-parse --verify --quiet "refs/tags/$tag_zgodnego_apk" >/dev/null; then
            echo "Web OTA pominięte — najpierw wymagane jest nowe APK / zwiększenie minNativeVersionCode."
            echo "Powod: Nie istnieje wydany tag zgodnego APK $tag_zgodnego_apk."
            echo "publikuj=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tag powstaje przed publikacją APK; sam nie potwierdza udanego wydania.
          wydanie_apk="$(gh api "repos/${{ github.repository }}/releases/tags/$tag_zgodnego_apk")"
          WYDANIE_APK="$wydanie_apk" KOD_APK="$kod_zgodnego_apk" TAG_APK="$tag_zgodnego_apk" node --input-type=module <<'NODE'
          import { walidujManifestAktualizacji } from './scripts/android-wspolne.mjs'
          const wydanie = JSON.parse(process.env.WYDANIE_APK)
          if (wydanie.draft || wydanie.prerelease) throw new Error('Zgodne APK nie jest publicznym wydaniem produkcyjnym.')
          const plikManifestu = wydanie.assets.find((plik) => plik.name === 'latest.json')
          if (!plikManifestu) throw new Error('Wydanie APK nie zawiera latest.json.')
          const odpowiedz = await fetch(plikManifestu.browser_download_url)
          if (!odpowiedz.ok) throw new Error('Publiczny manifest APK jest niedostępny.')
          const manifest = walidujManifestAktualizacji(await odpowiedz.json())
          if (manifest.versionCode !== Number(process.env.KOD_APK) || `v${manifest.versionName}` !== process.env.TAG_APK) throw new Error('Wydanie APK nie odpowiada punktowi zgodności.')
          if (!wydanie.assets.some((plik) => plik.name === manifest.apkUrl && plik.size === manifest.size)) throw new Error('Brak zgodnego artefaktu APK.')
          NODE

          commit_ci="${{ needs.bramka_ci.outputs.commit_ci }}"
          git merge-base --is-ancestor "$tag_zgodnego_apk" "$commit_ci" || { echo 'Bundle nie pochodzi z linii zgodnego APK.' >&2; exit 1; }
          mapfile -d '' pliki < <(git log --no-renames --format= --name-only -z "$tag_zgodnego_apk..$commit_ci")
          if wynik="$(node scripts/web-ota-klasyfikacja.mjs "${pliki[@]}")"; then
            echo "$wynik"
            echo "publikuj=true" >> "$GITHUB_OUTPUT"
            echo "commit_bundla=$commit_ci" >> "$GITHUB_OUTPUT"
          else
            kod=$?
            echo "$wynik"
            if [[ "$kod" -ne 2 ]]; then
              exit "$kod"
            fi
            echo "Web OTA pominięte — wymagane nowe APK."
            echo "publikuj=false" >> "$GITHUB_OUTPUT"
          fi

  publikacja:
    name: Zbuduj, podpisz i opublikuj
    needs: ocena
    if: needs.ocena.outputs.publikuj == 'true'
    runs-on: ubuntu-latest
    environment: web-ota-production
    permissions:
      contents: write
    env:
      WEB_OTA_PUBLIC_KEY_SHA256: ${{ vars.WEB_OTA_PUBLIC_KEY_SHA256 }}
      ADRES_ZIP: https://github.com/${{ github.repository }}/releases/download/web-ota/web-ota.zip
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ocena.outputs.commit_bundla }}

      - name: Potwierdz oceniony commit przed buildem
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.ocena.outputs.commit_bundla }}"

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sprawdz konfiguracje publikacji
        shell: bash
        env:
          WEB_OTA_PRIVATE_KEY: ${{ secrets.WEB_OTA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$WEB_OTA_PRIVATE_KEY" ]] || { echo "Brak sekretu WEB_OTA_PRIVATE_KEY." >&2; exit 1; }
          [[ "$WEB_OTA_PUBLIC_KEY_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Brak poprawnej zmiennej WEB_OTA_PUBLIC_KEY_SHA256." >&2; exit 1; }
          wersja="${{ inputs.bundle_version }}"
          commit_bundla="${{ needs.ocena.outputs.commit_bundla }}"
          [[ -n "$wersja" ]] || wersja="${commit_bundla:0:7}"
          [[ "$wersja" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "Nieprawidlowy bundle_version." >&2; exit 1; }
          echo "WEB_OTA_BUNDLE_VERSION=$wersja" >> "$GITHUB_ENV"

      - name: Zainstaluj zaleznosci
        run: npm ci

      - name: Zbuduj dist
        run: npm run build
        env:
          GITHUB_SHA: ${{ needs.ocena.outputs.commit_bundla }}
          VITE_SYNC_API_URL: ''
          VITE_ANDROID_UPDATE_MANIFEST_URL: ''
          VITE_ANDROID_WEB_UPDATE_MANIFEST_URL: ''

      - name: Spakuj zawartosc dist
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          mkdir -p artifacts/web-ota
          (cd dist && zip -q -r ../artifacts/web-ota/web-ota.zip .)

      - name: Utworz i podpisz manifest
        shell: bash
        env:
          WEB_OTA_PRIVATE_KEY: ${{ secrets.WEB_OTA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          argumenty=(
            --zip artifacts/web-ota/web-ota.zip
            --output artifacts/web-ota/web-ota.json
            --url "$ADRES_ZIP"
            --commit-sha "${{ needs.ocena.outputs.commit_bundla }}"
            --bundle-version "$WEB_OTA_BUNDLE_VERSION"
          )
          node scripts/web-ota-manifest.mjs "${argumenty[@]}"

      - name: Zweryfikuj lokalny ZIP i manifest
        shell: bash
        env:
          WEB_OTA_PRIVATE_KEY: ${{ secrets.WEB_OTA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          unzip -t artifacts/web-ota/web-ota.zip
          unzip -Z1 artifacts/web-ota/web-ota.zip | grep -Fx 'index.html'
          node scripts/web-ota-weryfikacja.mjs \
            --zip artifacts/web-ota/web-ota.zip \
            --manifest artifacts/web-ota/web-ota.json \
            --commit-sha "${{ needs.ocena.outputs.commit_bundla }}"

      - name: Opublikuj ZIP
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view web-ota >/dev/null 2>&1; then
            gh release create web-ota --draft --prerelease --title "Web OTA" --notes "Staly kanal podpisanych szybkich aktualizacji Ogarniacza."
          fi
          gh release upload web-ota artifacts/web-ota/web-ota.zip --clobber

      - name: Pobierz i zweryfikuj ZIP przed publikacja manifestu
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/weryfikacja-zip
          gh release download web-ota --pattern web-ota.zip --dir artifacts/weryfikacja-zip --clobber
          cmp artifacts/web-ota/web-ota.zip artifacts/weryfikacja-zip/web-ota.zip
          unzip -t artifacts/weryfikacja-zip/web-ota.zip
          unzip -Z1 artifacts/weryfikacja-zip/web-ota.zip | grep -Fx 'index.html'

      - name: Opublikuj zweryfikowany manifest na koncu
        run: gh release upload web-ota artifacts/web-ota/web-ota.json --clobber

      - name: Zweryfikuj opublikowane assets
        shell: bash
        env:
          WEB_OTA_PRIVATE_KEY: ${{ secrets.WEB_OTA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/weryfikacja
          gh release download web-ota --pattern web-ota.zip --pattern web-ota.json --dir artifacts/weryfikacja --clobber
          cmp artifacts/web-ota/web-ota.zip artifacts/weryfikacja/web-ota.zip
          cmp artifacts/web-ota/web-ota.json artifacts/weryfikacja/web-ota.json
          unzip -t artifacts/weryfikacja/web-ota.zip
          unzip -Z1 artifacts/weryfikacja/web-ota.zip | grep -Fx 'index.html'
          node scripts/web-ota-weryfikacja.mjs \
            --zip artifacts/weryfikacja/web-ota.zip \
            --manifest artifacts/weryfikacja/web-ota.json \
            --commit-sha "${{ needs.ocena.outputs.commit_bundla }}"
      - name: Opublikuj release (draft -> publiczny)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Uzywamy 'gh release edit' zamiast 'gh api PATCH /releases/{id}',
          # bo gh release view --json id zwraca global node ID (base64),
          # a endpoint PATCH oczekuje numerycznego ID -> 404.
          # 'gh release edit' sam konwertuje node ID -> numeric ID.
          if [ "$(gh release view web-ota --json isDraft --jq .isDraft 2>/dev/null || echo 'missing')" = "true" ]; then
            gh release edit web-ota --draft=false --prerelease
            echo "Release web-ota opublikowany (draft=false)."
          else
            echo "Release web-ota nie jest draftem lub nie istnieje - nic nie zmieniam."
          fi
      - name: Zachowaj kopie diagnostyczna
        uses: actions/upload-artifact@v4
        with:
          name: web-ota-${{ env.WEB_OTA_BUNDLE_VERSION }}
          path: |
            artifacts/web-ota/web-ota.zip
            artifacts/web-ota/web-ota.json
          if-no-files-found: error
          retention-days: 30
