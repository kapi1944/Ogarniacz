name: Publikuj Ogarniacza

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Rodzaj kolejnej wersji
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      release_notes:
        description: Opcjonalne informacje o wydaniu
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Zatwierdź kanały runtime
    runs-on: ubuntu-latest
    environment: android-production
    if: github.ref == 'refs/heads/main'
    env:
      VITE_SYNC_API_URL: ${{ vars.ANDROID_SYNC_API_URL }}
      VITE_ANDROID_UPDATE_MANIFEST_URL: ${{ vars.ANDROID_UPDATE_MANIFEST_URL }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Zablokuj ponowne uruchomienie wydania
        if: github.run_attempt > 1
        run: |
          echo 'Uruchom nowy workflow z main; częściowe APK wznawiaj osobnym workflow.' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Potwierdź dokładny main i zielone CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]] || { echo 'main zmienił się; uruchom publikację ponownie.' >&2; exit 1; }
          wynik="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed" --jq ".workflow_runs | any(.[]; .head_sha == \"$GITHUB_SHA\" and .head_branch == \"main\" and (.event == \"push\" or .event == \"workflow_dispatch\") and .conclusion == \"success\")")"
          [[ "$wynik" == true ]] || { echo 'Brak zielonego CI dla dokładnego main SHA.' >&2; exit 1; }

      - name: Odczytaj punkty zatwierdzenia kanałów
        id: baza
        run: |
          set -euo pipefail
          tag="$(node --input-type=module -e "const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/releases/latest',{signal:AbortSignal.timeout(10000),headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN}}); if(r.status===404) process.exit(0); if(!r.ok) throw new Error('Odczyt wydania HTTP '+r.status); const m=await r.json(); if(!/^v\d+\.\d+\.\d+$/.test(m.tag_name??'')) throw new Error('Nieprawidlowy tag APK'); process.stdout.write(m.tag_name)")"
          stable="$(git ls-remote origin refs/heads/rpi-stable | cut -f1)"
          if [[ -n "$stable" ]]; then git fetch --no-tags origin rpi-stable:refs/remotes/origin/rpi-stable; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "wersja=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Sklasyfikuj zmiany od ostatnich zatwierdzeń
        id: kanaly
        env:
          BAZA_ANDROID: ${{ steps.baza.outputs.tag }}
          BAZA_RPI: ${{ steps.baza.outputs.stable }}
        run: node scripts/publikacja-klasyfikacja.mjs "$GITHUB_SHA" "$BAZA_ANDROID" "$BAZA_RPI" >> "$GITHUB_OUTPUT"

      - name: Sprawdź jednorazową konfigurację środowiska
        if: steps.kanaly.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          brak=()
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Release wolno uruchomić wyłącznie z main.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'Checkout nie odpowiada github.sha.' >&2; exit 1; }
          for wpis in VITE_SYNC_API_URL:ANDROID_SYNC_API_URL VITE_ANDROID_UPDATE_MANIFEST_URL:ANDROID_UPDATE_MANIFEST_URL ANDROID_RELEASE_KEYSTORE_BASE64:ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD:ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_PASSWORD:ANDROID_RELEASE_KEY_PASSWORD ANDROID_RELEASE_KEY_ALIAS:ANDROID_RELEASE_KEY_ALIAS; do
            zmienna="${wpis%%:*}"
            nazwa="${wpis#*:}"
            [[ -n "${!zmienna:-}" ]] || brak+=("$nazwa")
          done
          if ((${#brak[@]})); then
            echo "Brak konfiguracji Environment android-production: ${brak[*]}" >&2
            exit 1
          fi
          [[ "$VITE_ANDROID_UPDATE_MANIFEST_URL" == https://* ]] || { echo 'ANDROID_UPDATE_MANIFEST_URL musi używać HTTPS.' >&2; exit 1; }
          [[ "$VITE_SYNC_API_URL" == https://* ]] || { echo 'ANDROID_SYNC_API_URL musi używać prywatnego HTTPS.' >&2; exit 1; }

      - name: Odtwórz stały klucz i konfigurację signing
        if: steps.kanaly.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          klucz="$RUNNER_TEMP/ogarniacz-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$klucz"
          test -s "$klucz" || { echo 'Nie udało się odtworzyć ANDROID_RELEASE_KEYSTORE_BASE64.' >&2; exit 1; }
          cat > android/keystore.properties <<EOF
          storeFile=$klucz
          storePassword=$ANDROID_RELEASE_STORE_PASSWORD
          keyAlias=$ANDROID_RELEASE_KEY_ALIAS
          keyPassword=$ANDROID_RELEASE_KEY_PASSWORD
          EOF
          oczekiwany="$(node -p "require('./config/android-release.json').sha256Certyfikatu" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          faktyczny="$(keytool -list -v -keystore "$klucz" -alias "$ANDROID_RELEASE_KEY_ALIAS" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$faktyczny" == "$oczekiwany" ]] || { echo 'Fingerprint produkcyjnego keystore nie zgadza się z config/android-release.json.' >&2; exit 1; }

      - name: Przygotuj wersję Android APK
        if: steps.kanaly.outputs.android == 'true'
        env:
          RODZAJ_WERSJI: ${{ inputs.version_bump }}
          WERSJA_OPUBLIKOWANA: ${{ steps.baza.outputs.wersja }}
        run: node scripts/android-release-przygotowanie.mjs --version-bump "$RODZAJ_WERSJI" --published-version "$WERSJA_OPUBLIKOWANA"

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź reguły release
        run: npm run android:release:test

      - name: Zapisz opcjonalne release notes
        if: steps.kanaly.outputs.android == 'true' && inputs.release_notes != ''
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"

      - name: Zbuduj, podpisz i zweryfikuj artefakty przed commitem wersji
        if: steps.kanaly.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          argumenty=()
          if [[ -f "$RUNNER_TEMP/release-notes.md" ]]; then
            argumenty+=(--release-notes-file "$RUNNER_TEMP/release-notes.md")
          fi
          npm run android:release -- "${argumenty[@]}"

      - name: Sprawdź natywny updater przed zapisaniem wersji
        if: steps.kanaly.outputs.android == 'true'
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest --tests 'pl.ogarniacz.app.AktualizacjePluginTest' --tests 'pl.ogarniacz.app.MagazynAktualizacjiWebTest' --no-daemon

      - name: Zachowaj zweryfikowane artefakty przed commitem i tagiem
        if: steps.kanaly.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/Ogarniacz-*-release.apk
            android/app/build/outputs/apk/release/Ogarniacz-*-release.apk.sha256
            android/app/build/outputs/apk/release/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Zbuduj frontend i backend Raspberry
        if: steps.kanaly.outputs.raspberry == 'true'
        run: npm run build:production

      - name: Zapisz wersję dopiero po udanym buildzie
        if: steps.kanaly.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Przygotuj wydanie Androida $(node -p "require('./package.json').version")"
            [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]] || { echo 'origin/main przesunął się podczas builda.' >&2; exit 1; }
            git push origin HEAD:main
          fi

      - name: Zapewnij wykonywalność Gradle Wrappera
        if: steps.kanaly.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew || chmod +x android/gradlew
          test -x android/gradlew

      - name: Opublikuj tylko po przygotowaniu artefaktów
        if: steps.kanaly.outputs.android == 'true'
        shell: bash
        run: npm run android:release -- --publish-existing

      - name: Zatwierdź Raspberry dopiero po sukcesie wymaganych kanałów
        if: steps.kanaly.outputs.raspberry == 'true'
        run: bash scripts/publikacja-rpi-stable.sh "$(git rev-parse HEAD)"
