name: Automatyczna publikacja po CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-publish-main
  cancel-in-progress: false

jobs:
  dispatch:
    name: Uruchom istniejącą bezpieczną publikację
    if: >-
      vars.AUTO_PUBLISH_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Potwierdź, że zielone CI dotyczy aktualnego main
        env:
          GH_TOKEN: ${{ github.token }}
          ODBIORCA_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          aktualny="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$aktualny" != "$ODBIORCA_SHA" ]]; then
            echo 'Nowszy main istnieje. Publikację wykona CI nowszego commita.'
            exit 0
          fi
          wynik="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.conclusion')"
          [[ "$wynik" == success ]] || { echo 'CI nie jest zielone.' >&2; exit 1; }
          # SHA jest przenoszony jako wejście; zmiana main po dispatch też zostanie wykryta.
          gh workflow run android-release.yml --ref main \
            -f source_sha="$ODBIORCA_SHA" \
            -f automatyczna=true \
            -f version_bump=patch \
            -f release_notes="Automatyczna publikacja po zielonym CI: ${ODBIORCA_SHA:0:12}"
