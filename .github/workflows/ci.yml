name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint / typecheck / test / server / ota / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run --pool=forks --no-file-parallelism --maxWorkers=1

      - name: Server tests
        run: npm run server:test

      - name: Web OTA tests
        run: npm run web-ota:test

      - name: Android release tests
        run: npm run android:release:test

      - name: Build
        run: npm run build

  android:
    name: Android (JDK 21 / updater / build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npm ci

      - name: Przygotuj projekt Capacitor
        run: npm run build && npx cap sync android

      - name: Testy natywnego updatera
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest --tests 'pl.ogarniacz.app.AktualizacjePluginTest' --tests 'pl.ogarniacz.app.AktualizacjeWebPluginTest' --no-daemon

      - name: Gradle assembleDebug
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
