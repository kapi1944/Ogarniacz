name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint / typecheck / test / server / ota / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run --pool=forks --no-file-parallelism --maxWorkers=1

      - name: Server tests
        run: npm run server:test

      - name: Web OTA tests
        run: npm run web-ota:test

      - name: Build
        run: npm run build

  android:
    name: Android (tylko zmiany natywne)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'push' && (
        contains(join(github.event.commits.*.modified, ','), 'android/') ||
        contains(join(github.event.commits.*.modified, ','), 'capacitor.config')
      )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: npm ci

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
