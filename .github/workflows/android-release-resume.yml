name: Wznów częściowe wydanie wszystkich platform
on:
  workflow_dispatch:
    inputs:
      resume_version:
        description: Zapisana wersja X.Y.Z (bez podbijania numeru)
        required: true
        type: string
permissions:
  contents: read
  actions: write
jobs:
  wznowienie:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wznów ten sam proces i jego zweryfikowane archiwa
        env:
          GH_TOKEN: ${{ github.token }}
          WERSJA: ${{ inputs.resume_version }}
        run: |
          set -euo pipefail
          [[ "$WERSJA" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f resume_version="$WERSJA"
